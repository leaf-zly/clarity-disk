name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      VITE_UPDATE_CHANNEL: stable
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust release build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          cache-targets: true
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify frontend
        run: pnpm --filter @clarity-disk/desktop typecheck

      - name: Require and import Authenticode certificate
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_PFX_BASE64 -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw 'Signed releases require WINDOWS_CERTIFICATE_PFX_BASE64 and WINDOWS_CERTIFICATE_PASSWORD secrets.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'clarity-disk-release.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password -Exportable:$false
          if (-not $certificate -or -not $certificate.HasPrivateKey) { throw 'Authenticode certificate import failed.' }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $signingConfig = @{
            bundle = @{ windows = @{
              certificateThumbprint = $certificate.Thumbprint
              digestAlgorithm = 'sha256'
              timestampUrl = 'http://timestamp.digicert.com'
            } }
          } | ConvertTo-Json -Depth 5
          Set-Content -LiteralPath 'apps\desktop\src-tauri\tauri.signing.conf.json' -Value $signingConfig -Encoding utf8
          Remove-Item -LiteralPath $pfxPath

      - name: Build privileged broker
        shell: pwsh
        run: |
          cargo build --release --locked -p clarity-privileged-service --features partition-writes
          $signTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { $_.VersionInfo.FileVersionRaw } |
            Select-Object -Last 1 -ExpandProperty FullName
          if (-not $signTool) { throw 'Windows SDK signtool.exe was not found.' }
          & $signTool sign /sha1 $env:WINDOWS_CERTIFICATE_THUMBPRINT /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 'target\release\clarity-privileged-service.exe'
          $binaryRoot = "apps\desktop\src-tauri\binaries"
          New-Item -ItemType Directory -Path $binaryRoot -Force | Out-Null
          Copy-Item -LiteralPath "target\release\clarity-privileged-service.exe" -Destination "$binaryRoot\clarity-privileged-service-x86_64-pc-windows-msvc.exe"

      - name: Build NSIS installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Clarity Disk ${{ env.RELEASE_TAG }}
          releaseBody: See CHANGELOG.md for details.
          releaseDraft: true
          prerelease: false
          args: --bundles nsis --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.signing.conf.json --config src-tauri/tauri.updater-build.conf.json --config src-tauri/tauri.updater-stable.conf.json

      - name: Verify signed publisher and installer lifecycle
        shell: pwsh
        run: |
          $artifacts = @(
            'target\release\clarity-disk.exe',
            'target\release\clarity-privileged-service.exe'
          )
          $artifacts += Get-ChildItem -Path 'target\release\bundle\nsis\*.exe' | ForEach-Object FullName
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
              throw "Unexpected or invalid Authenticode signature: $artifact"
            }
          }
          $installer = Get-ChildItem -Path 'target\release\bundle\nsis\*.exe' | Select-Object -First 1
          .\scripts\release\Test-WindowsInstaller.ps1 -InstallerPath $installer.FullName -ExpectedThumbprint $env:WINDOWS_CERTIFICATE_THUMBPRINT

      - name: Create portable archive and checksums
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "clarity-disk-portable"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -LiteralPath "target\release\clarity-disk.exe" -Destination $staging
          Copy-Item -LiteralPath "target\release\clarity-privileged-service.exe" -Destination $staging
          Copy-Item -LiteralPath "README.md" -Destination $staging
          $portable = "target\release\clarity-disk-${{ env.RELEASE_TAG }}-windows-x64-portable.zip"
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $portable -CompressionLevel Optimal

          $releaseFiles = @($portable)
          $releaseFiles += Get-ChildItem -Path "target\release\bundle\nsis\*.exe" | ForEach-Object FullName
          $checksumFile = "target\release\SHA256SUMS.txt"
          $checksums = foreach ($file in $releaseFiles) {
            $hash = Get-FileHash -LiteralPath $file -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($file).Replace(' ', '.'))"
          }
          Set-Content -LiteralPath $checksumFile -Value $checksums -Encoding utf8

          gh release upload $env:RELEASE_TAG $portable $checksumFile --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            target/release/bundle/nsis/*.exe
            target/release/*-windows-x64-portable.zip
            target/release/SHA256SUMS.txt

      - name: Attach stable update manifest to verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $env:APP_VERSION = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne "v$env:APP_VERSION") { throw 'Release tag and embedded version must match.' }
          $installer = @(Get-ChildItem target/release/bundle/nsis/*.exe)
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer.' }
          node scripts/release/create-update-manifest.mjs $installer[0].FullName "$($installer[0].FullName).sig" CHANGELOG.md target/release/latest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $env:RELEASE_TAG target/release/latest.json --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
