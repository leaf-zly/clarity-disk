[package]
name = "clarity-privileged-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "One-shot least-privilege Windows broker for Clarity Disk"

[features]
default = []
partition-writes = []

[dependencies]
clarity-core.workspace = true
clarity-privileged-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[lints]
workspace = true
