[package]
name = "clarity-disk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Safe Windows disk management and cleanup"

[lib]
name = "clarity_disk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
clarity-core.workspace = true
clarity-privileged-protocol.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }
tauri.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
# `wmi` accepts multiple incompatible windows-core generations. Pin the COM
# ABI to the generation used by `windows` 0.61 so its interfaces stay coherent.
windows-core = "=0.62.2"
wmi = { version = "0.18.4", default-features = false }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Power",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Ioctl",
  "Win32_System_IO",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[lints]
workspace = true
