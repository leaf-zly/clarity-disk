[workspace]
members = [
  "apps/desktop/src-tauri",
  "apps/privileged-service",
  "crates/clarity-core",
  "crates/clarity-privileged-protocol",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Proprietary"
authors = ["Clarity Disk Contributors"]
repository = "https://github.com/leaf-zly/clarity-disk"

[workspace.dependencies]
clarity-core = { path = "crates/clarity-core" }
clarity-privileged-protocol = { path = "crates/clarity-privileged-protocol" }
getrandom = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tauri = "2.11.5"
thiserror = "2.0.20"

[workspace.lints.rust]
# Windows system APIs require a very small, reviewed FFI boundary. Unsafe code
# remains denied by default and is enabled only at the documented call site.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

# Release builds are cached by GitHub Actions. Thin LTO and parallel codegen balance
# installer size and build time without turning every release into a long full-LTO build.
[profile.release]
codegen-units = 16
incremental = true
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
