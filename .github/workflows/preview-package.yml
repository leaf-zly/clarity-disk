name: Windows unsigned preview package

on:
  workflow_dispatch:
    inputs:
      publish_update:
        description: Publish a signed-updater preview to the opt-in preview feed
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: windows-unsigned-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-windows:
    name: Build unsigned Windows preview
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      VITE_UPDATE_CHANNEL: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust preview build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-preview
          cache-targets: true
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify frontend and updater manifest rules
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/release/create-update-manifest.test.mjs

      - name: Read application version
        shell: pwsh
        run: |
          $config = Get-Content -LiteralPath 'apps\desktop\src-tauri\tauri.conf.json' -Raw | ConvertFrom-Json
          if ($config.version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Application version is not semantic: $($config.version)"
          }
          "APP_VERSION=$($config.version)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $notes = "docs/release/$($config.version)-preview.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing version-specific release notes: $notes" }
          "UPDATE_NOTES_PATH=$notes" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build privileged broker
        shell: pwsh
        run: |
          cargo build --release --locked -p clarity-privileged-service --features partition-writes
          $binaryRoot = 'apps\desktop\src-tauri\binaries'
          New-Item -ItemType Directory -Path $binaryRoot -Force | Out-Null
          Copy-Item -LiteralPath 'target\release\clarity-privileged-service.exe' -Destination "$binaryRoot\clarity-privileged-service-x86_64-pc-windows-msvc.exe"

      - name: Build unsigned NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @clarity-disk/desktop tauri build --bundles nsis --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.updater-build.conf.json

      - name: Stage preview artifact
        shell: pwsh
        run: |
          $artifactRoot = 'target\preview-artifact'
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          $installers = @(Get-ChildItem -Path 'target\release\bundle\nsis\*.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          $installedName = $installers[0].Name.Replace(' ', '.')
          $stagedInstaller = Join-Path $artifactRoot $installedName
          Copy-Item -LiteralPath $installers[0].FullName -Destination $stagedInstaller
          Copy-Item -LiteralPath "$($installers[0].FullName).sig" -Destination "$stagedInstaller.sig"
          node scripts/release/create-update-manifest.mjs $stagedInstaller "$stagedInstaller.sig" $env:UPDATE_NOTES_PATH "$artifactRoot\latest.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $installedName" | Set-Content -LiteralPath "$artifactRoot\SHA256SUMS.txt" -Encoding utf8
          @(
            'UNSIGNED TEST BUILD — NOT FOR DISTRIBUTION',
            'This package was built on a GitHub-hosted Windows runner without an Authenticode certificate.',
            'Windows SmartScreen or antivirus software may display an unsigned-publisher warning.',
            "Source commit: $env:GITHUB_SHA"
          ) | Set-Content -LiteralPath "$artifactRoot\UNSIGNED-PREVIEW.txt" -Encoding utf8

      - name: Upload unsigned preview
        uses: actions/upload-artifact@v6
        with:
          name: clarity-disk-v${{ env.APP_VERSION }}-windows-x64-unsigned-preview
          path: target/preview-artifact/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish preview warning
        shell: pwsh
        run: |
          @'
          ## Unsigned Windows preview

          This artifact is for short-lived functional testing only. It is not a formal release,
          has no Authenticode publisher, and may trigger SmartScreen or antivirus warnings.
          '@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      # Publish the feed last. Existing clients must never see a manifest before
      # its immutable installer and signature are available on the version release.
      - name: Publish opt-in preview update
        if: inputs.publish_update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(10)
          do {
            $runs = gh run list --repo $env:GITHUB_REPOSITORY --workflow ci.yml --commit $env:GITHUB_SHA --limit 1 --json status,conclusion | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $quality = @($runs) | Select-Object -First 1
            if ($quality -and $quality.status -eq 'completed') {
              if ($quality.conclusion -ne 'success') { throw 'CI failed for this exact source commit; refusing to publish an update.' }
              break
            }
            if ((Get-Date) -ge $deadline) { throw 'CI has not passed for this source commit; refusing to publish an update.' }
            Start-Sleep -Seconds 15
          } while ($true)
          $tag = "preview-v$env:APP_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Version already published. Bump the application version; do not replace immutable installer assets.' }
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --prerelease --title "Clarity Disk $env:APP_VERSION Preview" --notes-file $env:UPDATE_NOTES_PATH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem -LiteralPath target/preview-artifact -File | ForEach-Object FullName)
          gh release upload $tag @files --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release view update-preview --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create update-preview --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --latest=false --title 'Clarity Disk preview update feed' --notes 'Mutable manifest only. Preview installers are signed with the pinned updater key, not with a Windows publisher certificate.'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload update-preview target/preview-artifact/latest.json --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
